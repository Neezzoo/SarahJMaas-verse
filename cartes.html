<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartes · Maasverse</title>
  <meta name="description" content="Cartes interactives d'Erilea, Prythian, Midgard et Lunathion.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cartes">
  <main>
    <header class="entete-page conteneur">
      <p class="surtitre">GÉOGRAPHIE</p>
      <h1>Les cartes des mondes</h1>
      <p class="intro" style="margin-inline:auto">Zoomez à la molette ou en pinçant, déplacez la carte en la faisant glisser, et cliquez sur un lieu ou une région pour en savoir plus.</p>
    </header>
    <section class="section" style="padding-top:20px">
      <div class="conteneur">
        <div class="onglets" role="tablist" id="onglets"></div>
        <p class="centre meta" id="introCarte" style="margin-bottom:16px"></p>
        <div class="zone-carte">
          <div class="cadre-carte" id="cadreCarte">
            <div class="commandes">
              <button type="button" id="zoomPlus" aria-label="Zoomer">+</button>
              <button type="button" id="zoomMoins" aria-label="Dézoomer">−</button>
              <button type="button" id="zoomReset" aria-label="Vue d'ensemble">⤢</button>
            </div>
            <p class="aide-carte">Carte stylisée · positions indicatives</p>
          </div>
          <aside class="panneau-lieu">
            <div class="carte" id="panneau"></div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/data/livres.js"></script>
  <script src="assets/js/data/personnages.js"></script>
  <script src="assets/js/data/cartes.js"></script>
  <script src="assets/js/data/glossaire.js"></script>
  <script src="assets/js/data/fanarts.js"></script>
  <script src="assets/js/carte.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/cartes.js"></script>
</body>
</html>
